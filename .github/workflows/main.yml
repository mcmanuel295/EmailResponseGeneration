name: email writer pipeline
on:
  push:
    branches:
      - main

jobs:
  compile :
    runs-on: ubuntu-latest
    name: Compile project
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      - run: mvn clean compile -DskipTests

  build:
    name : build project
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      - run: mvn clean package -DskipTests


  docker:
    name: build and push to docker
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: extract version
        id: extract_version
        run: echo "VERSION = $(./mvnw exec:exec -q -Dexec.executable=echo -Dexec.args='${project.version}'--non-recursive )">>$GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/email-generator:${{steps.extract_version.outputs.VERSION}},
            ${{secrets.DOCKERHUB_USERNAME}}/email-generator:latest

          build-args:
            APP_VERSION =${{steps.extract_version.outputs.VERSION}}

